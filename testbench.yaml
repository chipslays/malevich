# Playground: `composer serve` boots a real Laravel app with Malevich installed
# and opens the component catalog with the kit (resources/kit) at http://127.0.0.1:8000/malevich

laravel: '@testbench'

providers:
  - Malevich\MalevichServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

env:
  - APP_DEBUG=true

workbench:
  start: '/malevich'
  install: true
  discovers:
    web: true
    views: true
